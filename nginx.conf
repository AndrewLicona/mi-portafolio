server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Cabeceras de seguridad (se repiten en cada location que define
    # add_header, porque nginx NO hereda add_header cuando el bloque
    # hijo define los suyos).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresion
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml font/woff
               font/woff2 application/manifest+json;

    # index.html nunca se cachea: los despliegues nuevos se ven al instante
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Assets generados por Astro (nombre con hash) -> cache inmutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Archivos de public/ (sin hash en el nombre): cache corta y SIN
    # "immutable", para que un cambio se vea en el siguiente despliegue.
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|css|js|mjs|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
