# Override para el despliegue MANUAL por SSH (fuera de Dokploy).
# Publica el puerto 3003 del host para probar sin dominio ni TLS.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Dokploy usa solo ./docker-compose.yml, asi que este archivo no le afecta.

services:
  portafolio:
    container_name: mi-portafolio
    ports:
      - "3003:80"
