# Produccion: un solo contenedor con nginx sirviendo el sitio estatico.
#
# - Sin etiquetas de Traefik: el trafico entra directo al nginx del contenedor.
# - Sin `container_name`: Dokploy ya usa el nombre del proyecto.
# - Sin `networks`: nada mas en el servidor necesita alcanzar al contenedor.
# - `ports: 3003:80` deja el sitio en http://<ip-del-servidor>:3003
#
# Si en el futuro quieres servirlo por dominio con TLS automatico, se agrega
# de nuevo la red `dokploy-network` y las etiquetas de Traefik (estan en el
# historial de git, commit e755e92).

services:
  portafolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: mi-portafolio:latest
    ports:
      - "3003:80"
    restart: unless-stopped
